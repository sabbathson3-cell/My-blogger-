<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoPlus Pro - Music App</title>
  <style>
    :root { --accent: #ff0000; --bg: #0f0f0f; --text: #ffffff; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: var(--bg); color: var(--text); }
    .header { padding: 15px; font-weight: bold; font-size: 20px; border-bottom: 1px solid #222; }
    .player-section { position: sticky; top: 0; z-index: 10; background: #000; }
    .video-ratio { position: relative; width: 100%; padding-top: 56.25%; }
    .video-ratio #yt-player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .meta { padding: 15px; }
    .meta h2 { font-size: 16px; margin-bottom: 10px; }
    .btn-share { background: #333; color: #fff; padding: 8px 15px; border-radius: 20px; border: none; cursor: pointer; }
    .feed { padding: 10px; }
    .card { display: flex; gap: 10px; margin-bottom: 15px; cursor: pointer; }
    .thumb { width: 120px; height: 68px; background: #222; border-radius: 8px; }
    .loader { text-align: center; padding: 20px; color: #888; }
  </style>
</head>
<body>

  <header class="header">VideoPlus Pro</header>

  <div class="player-section" id="player-box" style="display:none;">
    <div class="video-ratio"><div id="yt-player"></div></div>
    <div class="meta">
      <h2 id="video-title">Title</h2>
      <button class="btn-share" onclick="shareVideo()">🔗 Share Video</button>
    </div>
  </div>

  <main class="feed" id="video-grid"></main>
  <div class="loader" id="loader">Loading...</div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    let currentId = "";
    
    function playVideo(id, title) {
      currentId = id;
      document.getElementById('player-box').style.display = 'block';
      document.getElementById('video-title').innerText = title;

      if (!player) {
        player = new YT.Player('yt-player', {
          host: 'https://www.youtube-nocookie.com',
          videoId: id,
          playerVars: { 'autoplay': 1, 'modestbranding': 1 }
        });
      } else {
        player.loadVideoById(id);
      }
      window.scrollTo(0, 0);
    }

    function shareVideo() {
      if(navigator.share) navigator.share({title: 'Watch', url: 'https://youtu.be/' + currentId});
      else alert('Link: https://youtu.be/' + currentId);
    }

    // JSONP बाट डाटा तान्ने
    const script = document.createElement('script');
    script.src = "https://kgeet.blogspot.com/feeds/posts/default?alt=json-in-script&callback=onDataLoaded";
    document.body.appendChild(script);

    window.onDataLoaded = (data) => {
      document.getElementById('loader').style.display = 'none';
      const grid = document.getElementById('video-grid');
      data.feed.entry.forEach(entry => {
        const title = entry.title.$t;
        const jsonMatch = entry.content.$t.match(/\{[\s\S]*?\}/);
        const parsed = jsonMatch ? JSON.parse(jsonMatch[0]) : {};
        if(!parsed.id) return;

        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `<img src="https://img.youtube.com/vi/${parsed.id}/mqdefault.jpg" class="thumb"><div class="info"><h3>${title}</h3></div>`;
        div.onclick = () => playVideo(parsed.id, title);
        grid.appendChild(div);
      });
    };
  </script>
</body>
</html>
