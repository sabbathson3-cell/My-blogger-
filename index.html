<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MusicPlus Native</title>
  <style>
    /* Reset & Theme Styles */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #0f0f0f; color: #ffffff; overflow: hidden; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }

    /* Top Header Bar */
    .header-bar { 
      display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; 
      background: #0f0f0f; border-bottom: 1px solid #272727; flex-shrink: 0; height: 50px; position: relative;
    }
    .logo-text { font-size: 18px; font-weight: bold; display: flex; align-items: center; gap: 4px; cursor: pointer; }
    .logo-text span { background: #ff0000; padding: 2px 6px; border-radius: 4px; font-size: 12px; color: #fff; }
    .search-trigger-btn { font-size: 20px; background: none; border: none; color: #fff; cursor: pointer; padding: 4px; }
    
    /* Search Box Layer */
    .search-box-container { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0f0f0f; align-items: center; padding: 0 16px; z-index: 100; }
    .search-box-container.active { display: flex; }
    .search-form { display: flex; width: 100%; align-items: center; gap: 10px; }
    .search-input { flex-grow: 1; background: #272727; border: 1px solid #3f3f3f; color: #fff; padding: 6px 14px; border-radius: 18px; font-size: 14px; outline: none; }
    .search-close-btn { font-size: 20px; background: none; border: none; color: #aaa; cursor: pointer; }

    /* STICKY PLAYER PACK CONTAINER */
    .sticky-player-pack { display: none; position: sticky; top: 0; left: 0; width: 100%; background: #0f0f0f; z-index: 90; flex-shrink: 0; }
    .player-container { width: 100%; background: #000000; display: flex; flex-direction: column; overflow: hidden; }
    .player-ratio-box { position: relative; width: 100%; height: 0; padding-top: 56.25%; background: #000; }
    .player-ratio-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

    /* PLAYER META & LYRICS BUTTON */
    .mini-meta-box { display: block; padding: 12px 16px 6px 16px; background: #0f0f0f; }
    .mini-title { font-size: 17px; font-weight: 700; color: #ffffff; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
    .meta-line-two { display: flex; align-items: center; font-size: 13px; color: #aaa; gap: 4px; width: 100%; margin-bottom: 8px; }
    .meta-channel-name { color: #ffffff; font-weight: 600; }
    .more-trigger-btn { background: none; border: none; color: #3ea6ff; font-weight: bold; font-size: 13px; cursor: pointer; padding: 2px 4px; }

    /* Action Buttons Row */
    .action-buttons-row { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 12px 16px; background: #0f0f0f; border-bottom: 1px solid #212121; }
    .action-btn { background: #272727; color: #ffffff; padding: 6px 14px; border-radius: 18px; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; border: none; white-space: nowrap; cursor: pointer; }

    /* LYRICS DRAWER (BOTTOM PULL) */
    .desc-drawer-box { display: none; position: fixed; bottom: -100%; left: 0; width: 100%; height: 70vh; background: #0f0f0f; border-radius: 16px 16px 0 0; z-index: 1000; box-shadow: 0 -10px 40px rgba(0,0,0,0.8); transition: bottom 0.28s cubic-bezier(0, 0, 0.2, 1); flex-direction: column; border-top: 1px solid #272727; }
    .desc-drawer-box.open { display: flex; bottom: 0; }
    .desc-drawer-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1px solid #212121; position: relative; }
    .desc-drawer-header::before { content: ''; position: absolute; top: 6px; left: 50%; transform: translateX(-50%); width: 40px; height: 4px; background: #3f3f3f; border-radius: 2px; }
    .desc-drawer-header h2 { font-size: 18px; font-weight: 700; color: #fff; margin-top: 4px; }
    .desc-drawer-close { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; }
    .desc-drawer-body { flex-grow: 1; overflow-y: auto; padding: 20px 16px; }
    .desc-main-text-block { background: #212121; border-radius: 12px; padding: 16px; color: #f1f1f1; font-size: 15px; line-height: 1.7; white-space: pre-wrap; }

    /* Main Scroll Area */
    .main-scroll-content { flex-grow: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 80px; }
    
    /* Category Badges */
    .filter-tags { display: flex; gap: 8px; overflow-x: auto; padding: 12px; white-space: nowrap; background: #0f0f0f; position: sticky; top: 0; z-index: 50; }
    .cat-link { display: inline-block; background: #272727; padding: 6px 14px; border-radius: 8px; font-size: 14px; font-weight: 500; color: #fff; cursor: pointer; }
    .cat-link.active { background: #ffffff; color: #0f0f0f; }

    /* Native Video Feed Cards */
    .video-feed { padding: 4px 0; }
    .video-card { margin-bottom: 22px; display: flex; flex-direction: column; background: #0f0f0f; cursor: pointer; }
    .thumbnail-wrapper { position: relative; width: 100%; aspect-ratio: 16/9; background: #111; overflow: hidden; }
    .thumbnail-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    .video-details { display: flex; padding: 12px 14px 4px 14px; gap: 12px; }
    .channel-avatar { width: 38px; height: 38px; border-radius: 50%; background: #272727; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 15px; color: #ff0000; flex-shrink: 0; border: 1px solid #3f3f3f; }
    .meta-data { flex-grow: 1; }
    .video-title { font-size: 15px; font-weight: 500; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 4px; color: #f1f1f1; }
    .video-info { font-size: 12px; color: #aaa; display: flex; gap: 4px; align-items: center; }

    /* BOTTOM NAV BAR */
    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 55px; background: #0f0f0f; border-top: 1px solid #272727; display: flex; justify-content: space-around; align-items: center; font-size: 11px; z-index: 90; }
    .nav-item { text-align: center; color: #aaa; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; height: 100%; }
    .nav-item.active { color: #fff; }
    .nav-item span { display: block; font-size: 19px; margin-bottom: 2px; }
    
    .menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 500; display: none; }
    .menu-overlay.active { display: block; }
    .app-loader { display: none; padding: 40px; text-align: center; color: #aaa; font-size: 15px; width: 100%; }
  </style>
</head>
<body>

  <header class="header-bar">
    <div class="logo-text" id="logo-home">MusicPlus <span>NATIVE</span></div>
    <button class="search-trigger-btn" id="open-search">🔍</button>
    
    <div class="search-box-container" id="search-box-holder">
      <form class="search-form" id="app-search-form">
        <input class="search-input" id="search-input-field" placeholder="गीत वा लिरिक्स सर्च गर्नुहोस्..." required type="text">
        <button class="search-close-btn" id="close-search" type="button">✕</button>
      </form>
    </div>
  </header>

  <div class="menu-overlay" id="global-overlay"></div>

  <div class="sticky-player-pack" id="master-player-pack">
    <section class="player-container" id="player-iframe-slot"></section>
    <div class="mini-meta-box">
      <h1 class="mini-title" id="player-title">Loading...</h1>
      <div class="meta-line-two">
        <span class="meta-channel-name" id="player-channel">@Channel</span>
        <span>•</span>
        <span id="player-views">0 views</span>
        <button class="more-trigger-btn" id="open-lyrics-btn">...Lyrics</button>
      </div>
    </div>
    <div class="action-buttons-row">
      <button class="action-btn" id="share-btn">↩️ Share</button>
      <button class="action-btn" id="download-btn">📥 Download</button>
    </div>
  </div>

  <div class="desc-drawer-box" id="lyrics-drawer">
    <div class="desc-drawer-header">
      <h2>Song Lyrics & Info</h2>
      <button class="desc-drawer-close" id="close-lyrics-btn">✕</button>
    </div>
    <div class="desc-drawer-body">
      <div class="desc-main-text-block" id="lyrics-body-text">Loading...</div>
    </div>
  </div>

  <main class="main-scroll-content" id="scroll-holder">
    <div class="filter-tags" id="category-bar">
      <span class="cat-link active" data-cat="">All</span>
      <span class="cat-link" data-cat="Music">Music</span>
      <span class="cat-link" data-cat="Lyrics">Lyrics</span>
      <span class="cat-link" data-cat="Trending">Trending</span>
    </div>

    <div class="app-loader" id="main-loader">⏳ Loading Cloud JSON Content...</div>
    <div class="video-feed" id="native-render-grid"></div>
  </main>

  <nav class="bottom-nav">
    <div class="nav-item active" id="nav-home"><span>🏠</span>Home</div>
    <div class="nav-item" id="nav-trending"><span>🔥</span>Trending</div>
  </nav>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // तपाईंको आफ्नै गिटहब जिस्टको RAW लिङ्क यहाँ सेट गरिएको छ
    const JSON_URL = "https://gist.githubusercontent.com/sabbathson3-cell/efb6581982c84c88e4f0c2923b7f704c/raw/songs.json"; 

    let localSongsDatabase = [];
    let ytPlayer = null;
    let selectedCategory = "";
    let searchQuery = "";
    let activeVideo = { id: "", title: "" };

    // JSON डेटा क्लाउडबाट तान्ने फङ्क्सन
    async function loadNativeDatabase() {
      const loader = document.getElementById('main-loader');
      const grid = document.getElementById('native-render-grid');
      loader.style.display = 'block';
      grid.innerHTML = "";

      try {
        const response = await fetch(JSON_URL);
        localSongsDatabase = await response.json();
        renderSongsFeed();
      } catch (error) {
        grid.innerHTML = "<div style='padding:40px; text-align:center; color:#aaa;'>❌ Cloud JSON लोड हुन सकेन। गिटहब जिस्ट चेक गर्नुहोस्।</div>";
      } finally {
        loader.style.display = 'none';
      }
    }

    // स्क्रिनमा गीतहरू फिल्टर गरेर देखाउने इन्जिन
    function renderSongsFeed() {
      const grid = document.getElementById('native-render-grid');
      grid.innerHTML = "";

      const filtered = localSongsDatabase.filter(song => {
        const matchesCat = !selectedCategory || song.category === selectedCategory;
        const songTitle = song.title ? song.title.toLowerCase() : "";
        const songLyrics = song.lyrics ? song.lyrics.toLowerCase() : "";
        const matchesSearch = !searchQuery || 
          songTitle.includes(searchQuery.toLowerCase()) || 
          songLyrics.includes(searchQuery.toLowerCase());
        return matchesCat && matchesSearch;
      });

      if(filtered.length === 0) {
        grid.innerHTML = "<div style='padding:50px; text-align:center; color:#aaa;'>🔍 खोजिएको गीत फेला परेन।</div>";
        return;
      }

      filtered.forEach(song => {
        const card = document.createElement('div');
        card.className = "video-card";
        const channelName = song.channel || "Official";
        card.innerHTML = `
          <div class="thumbnail-wrapper">
            <img src="https://img.youtube.com/vi/${song.id}/mqdefault.jpg" alt="Thumb">
          </div>
          <div class="video-details">
            <div class="channel-avatar"><span>${channelName.charAt(0).toUpperCase()}</span></div>
            <div class="meta-data">
              <h3 class="video-title">${song.title || 'Untitled Song'}</h3>
              <div class="video-info"><span>@${channelName}</span>•<span>${song.views || '100K'}</span></div>
            </div>
          </div>
        `;
        card.addEventListener('click', () => playNativeVideo(song));
        grid.appendChild(card);
      });
    }

    // युट्युब प्लेयर चलाउने फङ्क्सन
    function playNativeVideo(song) {
      activeVideo = { id: song.id, title: song.title };
      document.getElementById('master-player-pack').style.display = 'block';
      document.getElementById('player-title').innerText = song.title || 'Untitled';
      document.getElementById('player-channel').innerText = "@" + (song.channel || "Official");
      document.getElementById('player-views').innerText = song.views || "100K views";
      document.getElementById('lyrics-body-text').innerText = song.lyrics || "यो गीतको लिरिक्स उपलब्ध छैन।";

      const slot = document.getElementById('player-iframe-slot');
      slot.innerHTML = '<div class="player-ratio-box"><div id="yt-embed-target"></div></div>';

      if(ytPlayer && ytPlayer.destroy) { try { ytPlayer.destroy(); } catch(e){} }

      ytPlayer = new YT.Player('yt-embed-target', {
        width: '100%', height: '100%', videoId: song.id,
        playerVars: { 'autoplay': 1, 'controls': 1, 'rel': 0 }
      });

      document.getElementById('scroll-holder').scrollTop = 0;
    }

    // Event Listeners र एप कन्ट्रोलरहरू
    document.addEventListener("DOMContentLoaded", () => {
      loadNativeDatabase();

      // क्याटेगोरी फिल्टर
      const tags = document.querySelectorAll('.cat-link');
      tags.forEach(tag => {
        tag.addEventListener('click', () => {
          tags.forEach(t => t.classList.remove('active'));
          tag.classList.add('active');
          selectedCategory = tag.getAttribute('data-cat');
          searchQuery = "";
          renderSongsFeed();
        });
      });

      // सर्च फर्म
      document.getElementById('app-search-form').addEventListener('submit', (e) => {
        e.preventDefault();
        searchQuery = document.getElementById('search-input-field').value.trim();
        document.getElementById('search-box-holder').classList.remove('active');
        renderSongsFeed();
      });

      // मेनु र लिरिक्स प्यानल कन्ट्रोल
      const overlay = document.getElementById('global-overlay');
      const drawer = document.getElementById('lyrics-drawer');

      document.getElementById('open-lyrics-btn').addEventListener('click', () => { drawer.classList.add('open'); overlay.classList.add('active'); });
      document.getElementById('close-lyrics-btn').addEventListener('click', () => { drawer.classList.remove('open'); overlay.classList.remove('active'); });
      overlay.addEventListener('click', () => { drawer.classList.remove('open'); overlay.classList.remove('active'); });

      document.getElementById('open-search').addEventListener('click', () => document.getElementById('search-box-holder').classList.add('active'));
      document.getElementById('close-search').addEventListener('click', () => document.getElementById('search-box-holder').classList.remove('active'));

      // बटम नेभिगेसन
      document.getElementById('nav-home').addEventListener('click', () => { selectedCategory = ""; searchQuery = ""; renderSongsFeed(); });
      document.getElementById('nav-trending').addEventListener('click', () => { selectedCategory = "Trending"; searchQuery = ""; renderSongsFeed(); });
      document.getElementById('logo-home').addEventListener('click', () => { selectedCategory = ""; searchQuery = ""; renderSongsFeed(); });

      // सेयर र डाउनलोड
      document.getElementById('share-btn').addEventListener('click', () => {
        if(navigator.share && activeVideo.id) {
          navigator.share({ title: activeVideo.title, url: `https://youtu.be/${activeVideo.id}` });
        } else if(activeVideo.id) {
          alert("Share Link: https://youtu.be/" + activeVideo.id);
        }
      });
      document.getElementById('download-btn').addEventListener('click', () => {
        if(activeVideo.id) window.open(`https://www.ssyoutube.com/watch?v=${activeVideo.id}`, '_blank');
      });
    });
  </script>
</body>
</html>
