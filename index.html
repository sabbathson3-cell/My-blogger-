<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VideoPlus - SPA Music App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body { background-color: #0f0f0f; color: #ffffff; height: 100vh; display: flex; flex-direction: column; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #0f0f0f; border-bottom: 1px solid #272727; }
    .sticky-player-pack { display: none; width: 100%; background: #000; }
    .player-ratio-box { position: relative; width: 100%; padding-top: 56.25%; }
    .player-ratio-box #yt-placeholder { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .main-scroll-content { flex-grow: 1; overflow-y: auto; padding: 10px; }
    .video-card { margin-bottom: 20px; display: flex; cursor: pointer; }
    .thumbnail { width: 120px; height: 68px; background: #222; flex-shrink: 0; }
    .video-title { padding-left: 10px; font-size: 14px; }
  </style>
</head>
<body>

  <header class="header-bar">
    <div id="logo-home-btn">VideoPlus</div>
  </header>

  <div class="sticky-player-pack" id="master-player-pack">
    <div class="player-container" id="player-target-iframe-box">
      <div class="player-ratio-box"><div id="yt-placeholder"></div></div>
    </div>
    <div style="padding: 10px;" id="player-title">Loading...</div>
  </div>

  <main class="main-scroll-content" id="songs-render-grid"></main>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let ytPlayer = null;
    const BLOG_URL = "https://kgeet.blogspot.com";

    function playTargetYouTubeVideo(id, title) {
      document.getElementById('master-player-pack').style.display = 'block';
      document.getElementById('player-title').innerText = title;

      const container = document.getElementById('player-target-iframe-box');
      container.innerHTML = '<div class="player-ratio-box"><div id="yt-placeholder"></div></div>';

      // youtube-nocookie प्रयोग गर्नाले धेरै जसो ट्रयाकर र विज्ञापन कम हुन्छन्
      ytPlayer = new YT.Player('yt-placeholder', {
        host: 'https://www.youtube-nocookie.com',
        videoId: id,
        playerVars: { 'autoplay': 1, 'rel': 0, 'modestbranding': 1, 'playsinline': 1 }
      });
    }

    function fetchBloggerDataAPI() {
      const script = document.createElement('script');
      script.src = `${BLOG_URL}/feeds/posts/default?alt=json-in-script&callback=parseBloggerResponse&max-results=10`;
      document.body.appendChild(script);
    }

    window.parseBloggerResponse = function(data) {
      const grid = document.getElementById('songs-render-grid');
      data.feed.entry.forEach(entry => {
        const title = entry.title.$t;
        const content = entry.content.$t;
        const jsonMatch = content.match(/\{[\s\S]*?\}/);
        const parsed = jsonMatch ? JSON.parse(jsonMatch[0]) : {};
        if(!parsed.id) return;

        const card = document.createElement('div');
        card.className = "video-card";
        card.innerHTML = `<div class="thumbnail"><img src="https://img.youtube.com/vi/${parsed.id}/mqdefault.jpg" width="120" height="68"></div><div class="video-title">${title}</div>`;
        card.onclick = () => playTargetYouTubeVideo(parsed.id, title);
        grid.appendChild(card);
      });
    };

    document.addEventListener("DOMContentLoaded", fetchBloggerDataAPI);
  </script>
</body>
</html>
