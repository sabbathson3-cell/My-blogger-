<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VideoPlus - True SPA Music App</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #0f0f0f; color: #ffffff; overflow: hidden; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
    a { color: inherit; text-decoration: none; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #0f0f0f; border-bottom: 1px solid #272727; flex-shrink: 0; z-index: 10001; height: 50px; position: relative; }
    .logo-text { font-size: 18px; font-weight: bold; cursor: pointer; }
    .search-box-container { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0f0f0f; align-items: center; padding: 0 16px; z-index: 10002; }
    .search-box-container.active { display: flex; }
    .search-input { flex-grow: 1; background: #272727; border: 1px solid #3f3f3f; color: #fff; padding: 6px 14px; border-radius: 18px; outline: none; }
    .sticky-player-pack { display: none; width: 100%; background: #0f0f0f; z-index: 9999; flex-shrink: 0; }
    .player-ratio-box { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
    .player-ratio-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .mini-meta-box { padding: 12px 16px; }
    .main-scroll-content { flex-grow: 1; overflow-y: auto; padding-bottom: 80px; }
    .video-card { margin-bottom: 22px; cursor: pointer; }
    .thumbnail-wrapper { width: 100%; aspect-ratio: 16/9; background: #111; }
    .thumbnail-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    .video-details { display: flex; padding: 12px; gap: 12px; }
    .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 55px; background: #0f0f0f; border-top: 1px solid #272727; display: flex; justify-content: space-around; align-items: center; z-index: 10001; }
  </style>
</head>
<body>

  <header class="header-bar">
    <div class="logo-text" id="logo-home-btn">VideoPlus <span>SPA</span></div>
    <button id="open-search-btn">🔍</button>
    <div class="search-box-container" id="search-box-holder">
      <form class="search-form" id="app-search-form">
        <input class="search-input" id="search-raw-input" placeholder="Search..." required type="text">
        <button type="button" id="close-search-btn">✕</button>
      </form>
    </div>
  </header>

  <div class="sticky-player-pack" id="master-player-pack">
    <div class="player-container" id="player-target-iframe-box"></div>
    <div class="mini-meta-box">
      <h1 id="player-title">Loading...</h1>
    </div>
  </div>

  <main class="main-scroll-content" id="feed-scroll-container">
    <div class="video-feed" id="songs-render-grid"></div>
  </main>

  <nav class="bottom-nav">
    <div id="nav-home-btn">🏠 Home</div>
    <div id="load-more-btn-trigger">🎞️ More</div>
  </nav>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const BLOG_URL = "https://kgeet.blogspot.com"; 
    let ytPlayer = null;
    let currentStartIndex = 1;

    function playTargetYouTubeVideo(id, title) {
      document.getElementById('master-player-pack').style.display = 'block';
      document.getElementById('player-title').innerText = title;

      if (ytPlayer && typeof ytPlayer.cueVideoById === 'function') {
        ytPlayer.cueVideoById(id);
        ytPlayer.playVideo();
      } else {
        document.getElementById('player-target-iframe-box').innerHTML = '<div class="player-ratio-box"><div id="yt-placeholder"></div></div>';
        ytPlayer = new YT.Player('yt-placeholder', {
          width: '100%', height: '100%', videoId: id,
          playerVars: { 'autoplay': 1, 'rel': 0, 'modestbranding': 1 }
        });
      }
    }

    function fetchBloggerDataAPI(isAppend = false) {
      const script = document.createElement('script');
      script.src = `${BLOG_URL}/feeds/posts/default?alt=json-in-script&callback=parseBloggerResponse&max-results=15&start-index=${currentStartIndex}`;
      document.body.appendChild(script);
    }

    window.parseBloggerResponse = function(data) {
      const grid = document.getElementById('songs-render-grid');
      const entries = data.feed.entry;
      entries.forEach(entry => {
        const title = entry.title.$t;
        const content = entry.content.$t;
        const jsonMatch = content.match(/\{[\s\S]*?\}/);
        const parsed = jsonMatch ? JSON.parse(jsonMatch[0]) : {};
        const videoId = parsed.id;
        if(!videoId) return;

        const card = document.createElement('div');
        card.className = "video-card";
        card.innerHTML = `<div class="thumbnail-wrapper"><img src="https://img.youtube.com/vi/${videoId}/mqdefault.jpg"></div><div class="video-details">${title}</div>`;
        card.onclick = () => playTargetYouTubeVideo(videoId, title);
        grid.appendChild(card);
      });
      currentStartIndex += entries.length;
    };

    document.addEventListener("DOMContentLoaded", () => fetchBloggerDataAPI());
    document.getElementById('open-search-btn').onclick = () => document.getElementById('search-box-holder').classList.add('active');
    document.getElementById('close-search-btn').onclick = () => document.getElementById('search-box-holder').classList.remove('active');
  </script>
</body>
</html>
