<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Native Music Plus - Full Version</title>
  <style>
    :root { --primary: #ff0000; --bg: #0f0f0f; --text: #ffffff; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

    /* Header */
    .header { display: flex; justify-content: space-between; padding: 15px; border-bottom: 1px solid #272727; }
    
    /* Sticky Player */
    #player-section { display: none; background: #000; width: 100%; }
    .ratio { position: relative; width: 100%; padding-top: 56.25%; }
    .ratio iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    /* Content Area */
    .main-content { flex-grow: 1; overflow-y: auto; padding: 10px; }
    .card { display: flex; gap: 10px; margin-bottom: 15px; cursor: pointer; }
    .card img { width: 120px; border-radius: 8px; }

    /* Bottom Nav */
    .nav { display: flex; justify-content: space-around; padding: 10px; border-top: 1px solid #272727; }
  </style>
</head>
<body>

  <header class="header">
    <strong>MusicPlus NATIVE</strong>
    <input type="text" id="search-box" placeholder="गीत सर्च गर्नुहोस्..." style="background:#222; color:white; border:none; padding:5px; border-radius:10px;">
  </header>

  <div id="player-section">
    <div class="ratio"><div id="yt-player"></div></div>
    <div style="padding:10px;">
      <h3 id="p-title">...</h3>
      <button onclick="document.getElementById('drawer').style.bottom='0'">Lyrics हेर्नुहोस्</button>
    </div>
  </div>

  <main class="main-content" id="feed"></main>

  <div id="drawer" style="position:fixed; bottom:-100%; width:100%; height:60%; background:#1a1a1a; transition:0.3s; padding:20px; border-radius:20px 20px 0 0;">
    <button onclick="this.parentElement.style.bottom='-100%'">Close</button>
    <p id="lyrics-text" style="margin-top:20px; white-space:pre-wrap;"></p>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const JSON_URL = "यहाँ_तपाईंको_RAW_GIST_LINK_राख्नुहोस्";
    let songs = [];
    let player;

    async function fetchData() {
      const res = await fetch(JSON_URL);
      songs = await res.json();
      render(songs);
    }

    function render(data) {
      const feed = document.getElementById('feed');
      feed.innerHTML = data.map(s => `
        <div class="card" onclick="play('${s.id}', '${s.title}', \`${s.lyrics || 'लिरिक्स छैन'}\`)">
          <img src="https://img.youtube.com/vi/${s.id}/mqdefault.jpg">
          <div><p>${s.title}</p><small>@${s.channel}</small></div>
        </div>
      `).join('');
    }

    function play(id, title, lyrics) {
      document.getElementById('player-section').style.display = 'block';
      document.getElementById('p-title').innerText = title;
      document.getElementById('lyrics-text').innerText = lyrics;
      if (!player) {
        player = new YT.Player('yt-player', { videoId: id, playerVars: { autoplay: 1 } });
      } else {
        player.loadVideoById(id);
      }
    }

    document.getElementById('search-box').addEventListener('input', (e) => {
      const filtered = songs.filter(s => s.title.toLowerCase().includes(e.target.value.toLowerCase()));
      render(filtered);
    });

    fetchData();
  </script>
</body>
</html>
